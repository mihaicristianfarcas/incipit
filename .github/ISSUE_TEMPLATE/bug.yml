name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: did
    attributes:
      label: What you did
      description: The steps, from opening the app. Name the kind of book (PDF, EPUB) if one is involved.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: A screenshot helps. Leave out anything private from your own books and notes.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: The operating system and its version, and the computer's processor.
      placeholder: macOS 26.1, Apple M3
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Incipit version or commit
    validations:
      required: true
