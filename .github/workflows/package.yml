# The three packages (docs/packaging.md), made by their scripts as a release would make them and kept
# as the run's artifacts, for a person to download and try: the macOS disk image, the Windows
# installer and the Linux AppImage, unsigned and published nowhere. The Linux job also installs the
# checkout with tools/install-linux and takes it out again.
#
# It runs on a pull request that changes how a package is made (the scripts, packaging/, the build's
# settings, this file) and by hand on any branch (Actions > Packages > Run workflow). "CI passed"
# does not wait for it: a package build (thin LTO) takes longer than a change should wait for.
#
# - Linux builds on the oldest Ubuntu runner: a program built against a newer glibc does not start
#   on an older one. appimagetool is a pinned release checked against its SHA-256, and run without
#   FUSE (APPIMAGE_EXTRACT_AND_RUN), which runners do not have.
# - Windows builds on windows-2022, whose image has NSIS (3.10, in the runner image's list of
#   software); windows-2025's does not list it. Its tools/setup runs in Git Bash, as a person's does.
# - cargo-about is pinned to the version the packages were first made with.
#
# Actions are pinned to commits, with the version beside each, as in ci.yml.
name: Packages

on:
  pull_request:
    paths:
      - "tools/setup"
      - "tools/package-*"
      - "tools/install-*"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/incipit-app/build.rs"
      - ".github/workflows/package.yml"
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_ABOUT: 0.9.3

jobs:
  package-macos:
    name: macOS disk image
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo-about
        run: cargo install --locked "cargo-about@$CARGO_ABOUT" --features cli
      - run: tools/setup
      - run: tools/package-mac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            target/package/*.dmg
            target/package/*.sha256
          retention-days: 14

  package-windows:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo-about
        run: cargo install --locked "cargo-about@$CARGO_ABOUT" --features cli
      - run: tools/setup
      - run: tools/package-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            target/package/*-setup.exe
            target/package/*.sha256
          retention-days: 14

  package-linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APPIMAGETOOL: ${{ github.workspace }}/target/appimagetool
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # What GPUI links against on Linux (as in ci.yml), and the desktop file's checker.
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config clang libclang-dev \
            libasound2-dev libudev-dev \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libfontconfig-dev libfreetype-dev libxcb1-dev \
            libdbus-1-dev desktop-file-utils
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo-about
        run: cargo install --locked "cargo-about@$CARGO_ABOUT" --features cli
      - name: appimagetool
        run: |
          mkdir -p target
          curl -fL -o "$APPIMAGETOOL" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $APPIMAGETOOL" | sha256sum -c -
          chmod +x "$APPIMAGETOOL"
      - run: tools/setup
      - run: tools/package-linux
      - name: Install for this user, then remove
        run: |
          tools/install-linux
          if ldd ~/.local/share/incipit/bin/incipit | grep 'not found'; then exit 1; fi
          desktop-file-validate ~/.local/share/applications/*.desktop
          tools/install-linux --remove
          [ ! -e ~/.local/share/incipit ] && [ ! -e ~/.local/bin/incipit ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            target/package/*.AppImage
            target/package/*.sha256
          retention-days: 14
