[package]
name = "incipit-app"
description = "The spikes' window: a reader, math and a figure, each drawn natively in GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "incipit"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, features = ["runtime_shaders"] }
incipit-ui.workspace = true
incipit-scene = { path = "../incipit-scene" }
incipit-math = { path = "../incipit-math" }
incipit-book = { path = "../incipit-book" }
serde_json.workspace = true
anyhow.workspace = true
image = { version = "0.25", default-features = false }
futures = "0.3"
incipit-vault = { path = "../incipit-vault" }
dirs = "6"
incipit-learn = { path = "../incipit-learn" }
incipit-graph = { path = "../incipit-graph" }
incipit-llm = { path = "../incipit-llm" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
