[package]
name = "incipit-scene"
description = "The figure engine: a model fills in a spec, the engine lays it out, checks it and hands back marks to draw"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
# preserve_order: a schema's fields reach the model in the order written, which is the order it
# fills them in (the title before the content, nodes before the edges between them).
serde_json = { workspace = true, features = ["preserve_order"] }
