[package]
name = "incipit-voice"
description = "Speaking instead of typing: the microphone, local Whisper models (download, check, load) and transcription, with no window in it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
cpal = "0.18"
hound = "3.5"
ring = "0.17.14"
ureq = "3.5.1"

# Metal on Apple silicon and Intel Macs alike; elsewhere on the processor, as no one GPU API
# whisper.cpp builds for is on every Windows or Linux machine.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"

[dev-dependencies]
tempfile = "3.27.0"
